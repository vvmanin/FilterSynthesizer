# =====================================================================
#  shots.yaml — the manual's figure manifest.
#
#  One canonical worked example, walked once, photographed along the way:
#     5th-order Butterworth low-pass · fc = 2 kHz · passband gain 1.5 V/V
#     -> 5 poles = one real + two complex pairs
#     -> the real pole is ABSORBED, giving a 3rd-order section + a 2nd-order
#        section, which is exactly the case worth documenting
#     -> the gain lands on section 1, so one section is gained and one unity
#
#  Every number printed in the docs comes from this run. Change the example
#  here and the docs must change with it — that is the point of having it in
#  one place.
#
#  steps are CUMULATIVE: the run walks one browser session from top to bottom.
#  --only still executes the preceding steps, it just saves one PNG.
#
#  `controls:` lists the session-state keys a figure shows. doc_drift.py reads
#  it and tells you which figures a UI change invalidated. Keep it accurate —
#  it is the only thing standing between you and a manual full of stale images.
#
#  Labels marked VERIFY were written from a source reading, not from a live
#  run. `python tools/ui_inventory.py --print` prints the real ones, and
#  capture_shots.py warns about any label it cannot find.
# =====================================================================

entry: app.py

example:
  name: "5th-order Butterworth low-pass, 2 kHz, gain 1.5 V/V"
  spec:
    response: Butterworth
    filter_type: Lowpass
    order: 5
    unit: kHz
    fc: 2.0
    passband_gain: 1.5
    alpha_max_db: 3.0103        # Butterworth default
    stopband_db: 40.0
  expect:
    sections: 2
    section_1: "3rd order (complex pair + absorbed real pole), gained 1.5 V/V"
    section_2: "2nd order, unity"

shots:

# ---------------------------------------------------------------- 1. launch
- id: "01-first-run"
  doc: quick_start
  caption: "The app on first launch: specification on the left, five tabs across the top."
  region: {full: true}
  controls: []
  steps: []

# ------------------------------------------------------------- 2. the spec
- id: "02-sidebar-spec"
  doc: both
  caption: "The worked example's specification. Note the unit selector sits above the corner frequency."
  region: {sidebar: true}
  controls: [widget_sym_order, widget_fc, widget_gain]
  steps:
    # app.py sidebar: st.radio("Response", …) and st.radio("Filter Type", …),
    # both without a key — they are identified by their option text.
    - {do: radio,  option: "Butterworth"}
    - {do: radio,  option: "Lowpass"}
    - {do: number, label: "Order", value: 5}
    - {do: radio,  option: "kHz"}
    - {do: number, label: "Corner Frequency", value: 2.0}
    - {do: number, label: "Passband Gain, V/V", value: 1.5}

# --------------------------------------------------- 3-4. the approximation
- id: "03-magnitude"
  doc: quick_start
  caption: "Tab 1. Magnitude response — 3 dB down at the 2 kHz corner, no passband ripple."
  region: {block: "Magnitude", up: 1}                               # VERIFY anchor
  controls: []
  steps:
    - {do: tab, name: "📊 Response Plots"}

- id: "04-roots"
  doc: quick_start
  caption: "Tab 2. Five poles — one real and two complex pairs. The real pole is what gets absorbed."
  region: {block: "Poles", up: 1}                                   # VERIFY anchor
  controls: []
  steps:
    - {do: tab, name: "🔢 Roots & Transfer Function"}

# ----------------------------------------------------------- 5-6. pairing
- id: "05-pairing"
  doc: both
  caption: "Tab 3. The cascade: the real pole joins the low-Q pair as a 3rd-order section."
  region: {block: "Biquad", up: 1}                                  # VERIFY anchor
  controls: []
  steps:
    - {do: tab, name: "🧱 Biquad Pairing & Cascading"}

- id: "06-gain-distribution"
  doc: both
  caption: "The 1.5 V/V passband gain assigned to section 1; section 2 stays unity."
  region: {block: "Gain", up: 1}                                    # VERIFY anchor
  controls: []
  steps: []                                                         # VERIFY: add the gain-distribution steps

# ----------------------------------------------------------- 7-11. topology
- id: "07-topology-top"
  doc: both
  caption: "Tab 4. Both sections listed with their f₀, Q and — for section 1 — the absorbed pole fp."
  region: {full: true}
  controls: []
  steps:
    - {do: tab, name: "⚙️ Topology"}

- id: "08-convergence"
  doc: user_manual
  caption: "Convergence Settings. Defaults are right for a first run; raise thoroughness only when a solve comes back empty."
  region: {expander: "Convergence Settings"}
  controls: [hw_effort, hw_pole_tol_pct, hw_gain_tol_pct, hw_topk]
  steps:
    - {do: expand, label: "Convergence Settings"}

- id: "09-section-settings"
  doc: both
  caption: "Section 1 settings: topology family, op-amp, component envelope and E-series."
  region: {expander: "Section 1"}
  controls: [hw_fam_*, hw_opamp_choice_*, hw_cmin_*, hw_cmax_*, hw_rmin_*,
             hw_rmax_*, hw_ratio_*, hw_cser_*, hw_rser_*_*]
  steps:
    - {do: expand, label: "Convergence Settings"}        # collapse it again
    - {do: expand, label: "Section 1 — topology & component settings"}

- id: "10-solving"
  doc: both
  caption: "A solve in progress. The other sections and every other tab stay usable while it runs."
  region: {block: "Solving", up: 2}
  controls: [hw_solve_*]
  pad: 20
  steps:
    - {do: expand, label: "Section 1 — topology & component settings"}   # collapse
    - {do: click, button: "Solve section"}
    - {do: wait_text, text: "Solving", timeout: 30, settle: false}

- id: "11-bom-table"
  doc: both
  caption: "Candidate BOMs, ranked by sensitivity. Component columns adapt to the cells that were solved."
  region: {block: "Sort by", up: 2}
  controls: [hw_sortf_*, hw_sortd_*, hw_df_*]
  steps:
    - {do: wait_gone, text: "Solving", timeout: 900}
    - {do: wait_text, text: "Sort by", timeout: 60}

- id: "12-bom-picked"
  doc: both
  caption: "A selected row: the snapped BOM with ideal values in grey, and the annotated schematic."
  region: {block: "Capacitors", up: 3}
  controls: [hw_df_*]
  steps:
    - {do: row, index: 0}
    - {do: wait_text, text: "Selected #", timeout: 30}

- id: "13-schematic"
  doc: both
  caption: "The section schematic with designators and values overlaid, downloadable as SVG."
  region: {css: 'iframe[title="streamlit.components.v1.html"]'}
  controls: []
  steps:
    - {do: scroll_to, text: "Selected #"}

# ------------------------------------------- 14-17. cascade + report
- id: "14-cascade-bode"
  doc: both
  caption: "Tab 5. Design (blue) against the realized cascade (red) built from the snapped parts."
  region: {block: "Resulting Response", up: 1}
  controls: []
  steps:
    - {do: tab, name: "📉 Resulting Response & Schematic"}

- id: "15-monte-carlo"
  doc: both
  caption: "Tolerance spread over 2000 runs. The seed is a control, so the band is reproducible."
  region: {block: "Monte-Carlo tolerances", up: 2}
  controls: [resp_ctol, resp_runs, resp_dist, resp_seed, resp_envelope, resp_mc_run]
  steps:
    - {do: click, button: "Run Monte-Carlo"}
    - {do: sleep, seconds: 3}

- id: "16-report-block"
  doc: both
  caption: "The report section list. Everything is on by default."
  region: {block: "Generate Report", up: 2}
  controls: [rep2_cover, rep2_coeff, rep2_norm, rep2_metrics, rep2_warn, report_btn]
  steps:
    - {do: scroll_to, text: "Generate Report"}

- id: "17-report-download"
  doc: quick_start
  caption: "The finished PDF, ready to download."
  region: {block: "Download PDF", up: 2}
  controls: [report_dl]
  steps:
    - {do: click, button: "Generate Report"}
    - {do: wait_text, text: "Download PDF", timeout: 300}

# =====================================================================
#  FAILURE STATES — User Manual only.
#  Staged deliberately. These are the highest-value figures in the whole
#  manual: they are what someone is looking at when they go searching.
# =====================================================================

- id: "20-no-realization"
  doc: user_manual
  caption: "An envelope too tight to build in. The message names the ratio the design actually needs."
  region: {block: "No realization", up: 2}
  controls: [hw_rmax_*, hw_ratio_*]
  steps:
    - {do: tab, name: "⚙️ Topology"}
    - {do: expand, label: "Section 1 — topology & component settings"}
    - {do: number, label: "Max R ratio", value: 2}
    - {do: expand, label: "Section 1 — topology & component settings"}
    - {do: click, button: "Re-solve"}
    - {do: wait_gone, text: "Solving", timeout: 900}

# 21 (the "exact solver call" expander) was retired in v1.0.3: that view is
# developer-only now, shown only with FILTERSYNTHESIZER_DEBUG=1.

- id: "22-report-blocked"
  doc: user_manual
  caption: "The report refuses to build until every section has a chosen BOM, and says which are missing."
  region: {block: "Report generation is not available", up: 2}
  controls: [report_btn_blocked]
  steps:
    # undo figure 20's deliberately broken envelope first
    - {do: expand, label: "Section 1 — topology & component settings"}
    - {do: number, label: "Max R ratio", value: 500}
    - {do: expand, label: "Section 1 — topology & component settings"}
    # VERIFY: then reach the blocked state — picks are sticky by design, so
    # this needs a fresh cascade, or capture it before figure 12 instead
